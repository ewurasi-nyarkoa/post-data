<div class="post-form-container">
  <div class="post-form-card">
    <div class="form-header">
      <h2>Create New Post</h2>
      <button type="button" class="close-button" (click)="cancel()">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    
    <form #postForm="ngForm" (ngSubmit)="onSubmit(postForm)" class="post-form">
     
      <div class="form-group">
        <label for="userId">User ID</label>
        <input
          type="number"
          id="userId"
          name="userId"
          min="1"
          [(ngModel)]="formData.userId"
          (input)="onFieldChange('userId')"
          [class.error]="errors['userId']"
          required
        />
        <div *ngIf="errors['userId']" class="error-message">
          {{ errors['userId'] }}
        </div>
      </div>
      

      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          name="title"
          [(ngModel)]="formData.title"
          (input)="onFieldChange('title')"
          [class.error]="errors['title']"
          placeholder="Enter post title..."
          required
        />
        <div *ngIf="errors['title']" class="error-message">
          {{ errors['title'] }}
        </div>
      </div>
      
      <!-- Body Field -->
      <div class="form-group">
        <label for="body">Content</label>
        <textarea
          id="body"
          name="body"
          rows="8"
          [(ngModel)]="formData.body"
          (input)="onFieldChange('body')"
          [class.error]="errors['body']"
          placeholder="Write your post content here..."
          required
        ></textarea>
        <div *ngIf="errors['body']" class="error-message">
          {{ errors['body'] }}
        </div>
      </div>
      
      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
          <svg *ngIf="!isSubmitting" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
          </svg>
          <div *ngIf="isSubmitting" class="loading-spinner"></div>
          <span>{{ isSubmitting ? 'Creating...' : 'Create Post' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
